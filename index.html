<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="学校生活にぴったりの看護目標を選んでコピーできるツール" />
    <title>看護目標メーカー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">本文へ移動</a>

    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">目</span>
          <div>
            <p class="brand-kicker">SCHOOL GOAL MAKER</p>
            <h1>看護目標メーカー</h1>
          </div>
        </div>
        <div class="header-howto">
          <p class="header-howto-kicker">HOW TO USE</p>
          <h2>分野を選んで、目標を選ぶ</h2>
          <p>目標は<strong>いくつでも選択OK</strong>。最後にまとめてコピーできます。</p>
        </div>
      </div>
    </header>

    <main id="main-content" class="app-shell">
      <div class="workspace">
        <aside class="panel category-panel" aria-labelledby="category-heading">
          <div class="panel-heading">
            <p class="section-number">01</p>
            <h2 id="category-heading">分野</h2>
          </div>
          <div id="category-list" class="category-list" aria-label="看護目標の分野"></div>
        </aside>

        <section class="panel goal-panel" aria-labelledby="goals-heading">
          <div class="panel-heading goal-panel-heading">
            <div>
              <p class="section-number">02</p>
              <h2 id="goals-heading">文例</h2>
            </div>
            <p id="goals-description" class="panel-description">左の分野を選ぶと、文例が表示されます。</p>
          </div>
          <p class="selection-hint"><span aria-hidden="true">＋</span> クリックして選択。もう一度押すと解除できます。</p>
          <div id="goal-list" class="goal-list" aria-live="polite">
            <p class="empty-message">まずは左の分野を選んでください。</p>
          </div>
        </section>

        <aside class="panel selected-panel" aria-labelledby="selected-heading">
          <div class="panel-heading selected-heading">
            <div>
              <p class="section-number">03</p>
              <h2 id="selected-heading">選んだ目標</h2>
            </div>
            <span id="selected-count" class="count-badge" aria-label="選択数">0</span>
          </div>

          <div id="selected-list" class="selected-list" aria-live="polite">
            <p class="selected-empty">まだ目標を選んでいません。</p>
          </div>

          <div class="selected-actions">
            <button id="clear-button" class="button secondary full" type="button" disabled>すべて解除</button>
            <button id="copy-button" class="button primary full" type="button" disabled>
              <span aria-hidden="true">⧉</span> まとめてコピー
            </button>
            <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <p>看護目標のデータは <code>data/goals.json</code> で管理しています。</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
