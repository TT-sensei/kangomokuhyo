<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="学校生活にぴったりの看護目標を選んでコピーできるツール" />
    <title>看護目標メーカー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <p class="eyebrow">SCHOOL GOAL MAKER</p>
        <h1>看護目標メーカー</h1>
        <p class="subtitle">学校生活にぴったりの目標を選ぼう</p>
      </div>
    </header>

    <main class="container">
      <section class="selected-goal" aria-labelledby="selected-heading">
        <div class="selected-goal__heading">
          <span class="step-label">STEP 3</span>
          <h2 id="selected-heading">選んだ看護目標</h2>
        </div>
        <p id="selected-category" class="selected-category" hidden></p>
        <p id="selected-text" class="selected-text" aria-live="polite">目標を選ぶと、ここに表示されます。</p>
        <button id="copy-button" class="copy-button" type="button" disabled>
          <span aria-hidden="true">⧉</span> コピーする
        </button>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>

      <section class="step-section" aria-labelledby="category-heading">
        <div class="section-heading">
          <span class="step-label">STEP 1</span>
          <div>
            <h2 id="category-heading">分野を選ぶ</h2>
            <p>使いたい場面に近い分野を選んでください。</p>
          </div>
        </div>
        <div id="category-list" class="category-grid" aria-label="看護目標の分野"></div>
      </section>

      <section class="step-section goals-section" aria-labelledby="goals-heading">
        <div class="section-heading">
          <span class="step-label">STEP 2</span>
          <div>
            <h2 id="goals-heading">看護目標を選ぶ</h2>
            <p id="goals-description">分野を選ぶと、目標の候補が表示されます。</p>
          </div>
        </div>
        <div id="goal-list" class="goal-list" aria-live="polite">
          <p class="empty-message">まずは上の分野を選んでください。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">目標データは <code>data/goals.json</code> で管理しています。</footer>
    <script src="script.js"></script>
  </body>
</html>
